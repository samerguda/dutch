const container = document.getElementById("sentences");

function render(items) {

  container.innerHTML = "";

  items.forEach((item) => {

    const number = data.indexOf(item) + 1;

    const card = document.createElement("article");

    card.className = "sentence";

    const top = document.createElement("div");

    top.className = "topline";

    const badge = document.createElement("span");

    badge.className = "number";

    badge.textContent = number;

    const english = document.createElement("div");

    english.className = "english";

    english.textContent = item[0];

    top.append(badge, english);

    const arabic = document.createElement("div");

    arabic.className = "arabic";

    arabic.textContent = item[1];

    card.append(top, arabic);

    container.appendChild(card);

  });

  document.getElementById("counter").textContent =

    "عدد الأسئلة المعروضة: " + items.length + " من 100";

}

function filterSentences() {

  const q = document.getElementById("search").value.trim().toLowerCase();

  render(data.filter(item =>

    item[0].toLowerCase().includes(q) || item[1].includes(q)

  ));

}

function showAll() {

  document.getElementById("search").value = "";

  render(data);

}

function copyAll() {

  const text = data.map((item, i) =>

    (i + 1) + ". " + item[0] + "\n" + item[1]

  ).join("\n\n");

  if (navigator.clipboard && window.isSecureContext) {

    navigator.clipboard.writeText(text)

      .then(() => alert("تم نسخ الأسئلة الـ100!"))

      .catch(() => fallbackCopy(text));

  } else {

    fallbackCopy(text);

  }

}

function fallbackCopy(text) {

  const area = document.createElement("textarea");

  area.value = text;

  document.body.appendChild(area);

  area.select();

  try {

    document.execCommand("copy");

    alert("تم النسخ إذا سمح المتصفح بذلك.");

  } catch (e) {

    alert("تعذر النسخ تلقائيًا. يمكنك تحديد النص ونسخه.");

  }

  area.remove();

}
