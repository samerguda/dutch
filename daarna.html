const root = document.getElementById("sentences");

function render(items){
  root.innerHTML = "";
  items.forEach((item,index)=>{
    const card = document.createElement("div");
    card.className = "card";
    const number = document.createElement("div");
    number.className = "number";
    number.textContent = "الجملة " + (data.indexOf(item)+1);
    const nl = document.createElement("div");
    nl.className = "nl";
    nl.lang = "nl";
    nl.textContent = item[0];
    const label = document.createElement("div");
    label.className = "label";
    label.textContent = "الترجمة العربية";
    const ar = document.createElement("div");
    ar.className = "ar";
    ar.textContent = item[1];
    card.append(number,nl,label,ar);
    root.appendChild(card);
  });
}

function copyAll(){
  const text = data.map((item,i)=>
    `${i+1}. ${item[0]}\n${item[1]}`
  ).join("\n\n");
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text)
      .then(()=>alert("تم نسخ جميع الجمل بنجاح!"))
      .catch(()=>fallbackCopy(text));
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text){
  const area = document.createElement("textarea");
  area.value = text;
  document.body.appendChild(area);
  area.select();
  try{
    document.execCommand("copy");
    alert("تم نسخ الجمل.");
  }catch(e){
    alert("تعذر النسخ تلقائيًا. حدد النص وانسخه يدويًا.");
  }
  area.remove();
}

document.getElementById("search").addEventListener("input",function(){
  const q = this.value.trim().toLowerCase();
  render(data.filter(item=>
    item[0].toLowerCase().includes(q)||item[1].includes(q)
  ));
});

render(data);
