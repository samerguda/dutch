const root = document.getElementById("sentences");

sentences.forEach((item, index) => {
  const card = document.createElement("article");
  card.className = "sentence";

  const number = document.createElement("div");
  number.className = "number";
  number.textContent = index + 1;

  const nl = document.createElement("div");
  nl.className = "nl";
  nl.lang = "nl";
  nl.textContent = item[0];

  const ar = document.createElement("div");
  ar.className = "ar";
  ar.textContent = item[1];

  card.append(number, nl, ar);
  root.appendChild(card);

function copyAll() {
  const text = sentences.map((s, i) =>
    `${i + 1}. ${s[0]}\n${s[1]}`
  ).join("\n\n");

  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text)
      .then(() => alert("تم نسخ جميع الجمل بنجاح!"))
      .catch(() => fallbackCopy(text));
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text) {
  const area = document.createElement("textarea");
  area.value = text;
  document.body.appendChild(area);
  area.select();
  try {
    document.execCommand("copy");
    alert("تم نسخ الجمل!");
  } catch {
    alert("تعذر النسخ تلقائيًا. يمكنك تحديد الجمل ونسخها.");
  }
  area.remove();
}
