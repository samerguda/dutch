
<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>100 Vlaamse zinnen | أنا بقولك</title>
<style>
:root {
  --bg: #f3f6fb;
  --card: #ffffff;
  --primary: #174ea6;
  --accent: #f4c542;
  --text: #172033;
  --muted: #68758a;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.7;
}
header {
  background: linear-gradient(135deg,#123b78,#2877c7);
  color: white;
  padding: 34px 18px;
  text-align: center;
}
header h1 { margin: 0 0 10px; font-size: 28px; }
header p { margin: 5px 0; }
.badge {
  display: inline-block;
  margin-top: 12px;
  background: var(--accent);
  color: #172033;
  padding: 5px 13px;
  border-radius: 20px;
  font-weight: bold;
}
.container {
  max-width: 900px;
  margin: auto;
  padding: 18px;
}
.toolbar {
  position: sticky;
  top: 0;
  z-index: 5;
  background: var(--bg);
  padding: 12px 0;
}
input {
  width: 100%;
  padding: 14px;
  border: 1px solid #d5deeb;
  border-radius: 12px;
  font-size: 16px;
  background: white;
}
.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 10px;
}
button {
  border: 0;
  border-radius: 9px;
  padding: 10px 14px;
  background: var(--primary);
  color: white;
  font-size: 14px;
  cursor: pointer;
}
button:hover { opacity: .88; }
#count { color: var(--muted); margin: 12px 2px; }
.sentence {
  background: var(--card);
  border: 1px solid #e2e8f1;
  border-radius: 14px;
  padding: 17px;
  margin-bottom: 12px;
  box-shadow: 0 3px 10px #14213d08;
}
.topline {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-bottom: 8px;
}
.number {
  color: var(--primary);
  font-weight: bold;
  background: #eaf1ff;
  border-radius: 7px;
  padding: 3px 10px;
}
.nl {
  font-size: 17px;
  font-weight: bold;
  margin: 7px 0;
}
.ar {
  direction: rtl;
  text-align: right;
  font-size: 16px;
  color: #344054;
  margin: 7px 0;
}
.smallbtn { padding: 7px 10px; font-size: 12px; }
footer {
  text-align: center;
  color: var(--muted);
  padding: 25px;
}
@media(max-width:480px) {
  header h1 { font-size: 23px; }
  .container { padding: 12px; }
  .sentence { padding: 13px; }
  .nl { font-size: 16px; }
}
</style>
</head>
<body>

<header>
  <h1>100 Vlaamse Zinnen</h1>
  <p>تعلّم الفلمنكية البلجيكية من خلال جمل يومية</p>
  <p><strong>Ik zeg het je!</strong> — أنا بقولك!</p>
  <span class="badge">Nederlands in Vlaanderen 🇧🇪</span>
</header>

<main class="container">
  <div class="toolbar">
    <input id="search" type="search"
      placeholder="ابحث في الجمل الهولندية أو العربية..."
      oninput="render()">
    <div class="actions">
      <button onclick="copyAll()">نسخ كل الجمل</button>
      <button onclick="window.print()">طباعة / PDF</button>
      <button onclick="document.getElementById('search').value='';render()">عرض الكل</button>
    </div>
  </div>
  <p id="count"></p>
  <div id="list"></div>
</main>

<footer>
  Vlaams leren, stap voor stap 🇧🇪<br>
  تعلّم الفلمنكية خطوة بخطوة
</footer>

function render() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  const filtered = sentences
    .map((s,i) => ({s, i}))
    .filter(x => x.s.join(' ').toLowerCase().includes(q));

  document.getElementById('count').textContent =
    `عدد الجمل المعروضة: ${filtered.length} من ${sentences.length}`;

  document.getElementById('list').innerHTML = filtered.map(({s,i}) => `
    <article class="sentence">
      <div class="topline">
        <span class="number">الجملة ${i+1}</span>
        <button class="smallbtn" onclick="copyOne(${i})">نسخ الجملة</button>
      </div>
      <p class="nl" lang="nl">${escapeHTML(s[0])}</p>
      <p class="ar" lang="ar">${escapeHTML(s[1])}</p>
    </article>
  `).join('');
}

function escapeHTML(str) {
  return str.replace(/[&<>"']/g, c => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;',
    '"':'&quot;', "'":'&#39;'
  })[c]);
}

function copyOne(i) {
  const text = `${i+1}. ${sentences[i][0]}\n${sentences[i][1]}`;
  navigator.clipboard.writeText(text)
    .catch(() => alert(text));
}

function copyAll() {
  const text = sentences.map((s,i) =>
    `${i+1}. ${s[0]}\n${s[1]}`
  ).join('\n\n');

  navigator.clipboard.writeText(text)
    .then(() => alert('تم نسخ الجمل الـ100!'))
    .catch(() => alert('قد لا يدعم المتصفح النسخ التلقائي.'));
}

render();

</html>
