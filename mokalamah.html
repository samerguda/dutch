<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نبض الكون · cosmic pulse</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0f1e;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: system-ui, 'Segoe UI', monospace;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            filter: drop-shadow(0 0 15px rgba(0, 255, 255, 0.3));
            cursor: crosshair;
        }

        /* subtle overlay to enhance depth */
        .glow-overlay {
            position: fixed;
            inset: 0;
            pointer-events: none;
            background: radial-gradient(circle at 50% 50%, transparent 30%, #0a0f1e 90%);
            z-index: 2;
            mix-blend-mode: multiply;
        }

        /* tiny hint for interaction */
        .hint {
            position: fixed;
            bottom: 18px;
            left: 0;
            right: 0;
            text-align: center;
            color: rgba(180, 230, 255, 0.5);
            font-size: 0.9rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            z-index: 3;
            pointer-events: none;
            text-shadow: 0 0 12px #00aaff;
            font-weight: 300;
            backdrop-filter: blur(2px);
            font-family: 'Courier New', monospace;
        }
    </style>
</head>
<body>
    <canvas id="cosmicCanvas"></canvas>
    <div class="glow-overlay"></div>
    <div class="hint">⚡ أمواج الخيال ⚡</div>

    <script>
        (function() {
            const canvas = document.getElementById('cosmicCanvas');
            const ctx = canvas.getContext('2d');

            // ---- configuration ----
            const CONFIG = {
                particleCount: 380,          // slightly more for lushness
                baseRadius: 2.2,
                speedFactor: 0.55,
                waveAmplitude: 38,
                waveFrequency: 0.012,
                glowBlur: 18,
                hueShiftSpeed: 0.15,
                pointerInfluence: 0.12,
                pointerRadius: 200,
                maxLineDistance: 130,
            };

            // ---- state ----
            let width, height;
            let particles = [];
            let time = 0;
            let hueBase = 200;
            let mouse = { x: null, y: null, active: false };

            // ---- resize & init ----
            function resizeCanvas() {
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = width;
                canvas.height = height;

                // re-seed particles on resize for better distribution
                initParticles();
            }

            // ---- particle creation ----
            function initParticles() {
                particles = [];
                for (let i = 0; i < CONFIG.particleCount; i++) {
                    // random positions with bias to center (more density in middle)
                    const angle = Math.random() * Math.PI * 2;
                    const radius = Math.pow(Math.random(), 1.5) * Math.min(width, height) * 0.45;
                    const x = width / 2 + Math.cos(angle) * radius;
                    const y = height / 2 + Math.sin(angle) * radius;

                    // random velocity / drift
                    const vx = (Math.random() - 0.5) * CONFIG.speedFactor;
                    const vy = (Math.random() - 0.5) * CONFIG.speedFactor;

                    // unique phase offset for wave
                    const phase = Math.random() * Math.PI * 2;
                    // size variation
                    const size = CONFIG.baseRadius * (0.6 + Math.random() * 1.2);
                    // hue offset for individual particles
                    const hueOffset = (Math.random() - 0.5) * 40;

                    particles.push({
                        x, y,
                        vx, vy,
                        baseX: x,
                        baseY: y,
                        size,
                        phase,
                        hueOffset,
                        // store initial random for smoother wave
                        seed: Math.random() * 100,
                    });
                }
            }

            // ---- mouse tracking ----
            function handleMouseMove(e) {
                mouse.x = e.clientX;
                mouse.y = e.clientY;
                mouse.active = true;
            }

            function handleMouseLeave() {
                mouse.active = false;
                mouse.x = null;
                mouse.y = null;
            }

            // ---- animation loop ----
            function draw() {
                // update time & hue
                time += 0.01;
                hueBase = (hueBase + CONFIG.hueShiftSpeed) % 360;

                // clear with dark translucent overlay for trail effect (subtle)
                ctx.clearRect(0, 0, width, height);
                
                // deep space background with slight gradient
                const gradient = ctx.createRadialGradient(
                    width / 2, height / 2, 0,
                    width / 2, height / 2, Math.max(width, height) * 0.8
                );
                gradient.addColorStop(0, '#0b132b');
                gradient.addColorStop(0.7, '#060a14');
                gradient.addColorStop(1, '#010101');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, width, height);

                // ---- 1. draw glowing particles (with wave motion) ----
                ctx.shadowColor = '#3af0ff';
                ctx.shadowBlur = CONFIG.glowBlur;
                ctx.globalCompositeOperation = 'lighter'; // luminous blending

                for (let p of particles) {
                    // wave offset based on time & position
                    const waveX = Math.sin(time * 2.5 + p.baseY * 0.02 + p.phase) * CONFIG.waveAmplitude * 0.4;
                    const waveY = Math.cos(time * 2.0 + p.baseX * 0.02 + p.phase + 1.2) * CONFIG.waveAmplitude * 0.4;

                    // gentle drift (slow orbital flow)
                    p.baseX += p.vx * 0.2;
                    p.baseY += p.vy * 0.2;

                    // wrap around edges softly (keep inside canvas)
                    if (p.baseX < -50) p.baseX = width + 50;
                    if (p.baseX > width + 50) p.baseX = -50;
                    if (p.baseY < -50) p.baseY = height + 50;
                    if (p.baseY > height + 50) p.baseY = -50;

                    // apply wave + mouse influence
                    let targetX = p.baseX + waveX;
                    let targetY = p.baseY + waveY;

                    // subtle mouse attraction / repulsion (creative: gentle repulsion)
                    if (mouse.active && mouse.x !== null && mouse.y !== null) {
                        const dx = targetX - mouse.x;
                        const dy = targetY - mouse.y;
                        const dist = Math.hypot(dx, dy);
                        if (dist < CONFIG.pointerRadius && dist > 0.5) {
                            const force = (1 - dist / CONFIG.pointerRadius) * CONFIG.pointerInfluence;
                            // push away (repulsion) for dynamic feel
                            targetX += (dx / dist) * force * 45;
                            targetY += (dy / dist) * force * 45;
                        }
                    }

                    // final position with smoothing (lerp for fluidity)
                    p.x += (targetX - p.x) * 0.12;
                    p.y += (targetY - p.y) * 0.12;

                    // per-particle color
                    const hue = (hueBase + p.hueOffset + time * 15) % 360;
                    const light = 60 + Math.sin(time * 3 + p.seed) * 15;
                    const alpha = 0.75 + Math.sin(time * 2 + p.seed) * 0.2;

                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size * (0.9 + Math.sin(time * 4 + p.seed) * 0.15), 0, Math.PI * 2);
                    ctx.fillStyle = `hsla(${hue}, 90%, ${light}%, ${alpha})`;
                    ctx.fill();

                    // extra tiny glow dot inside
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size * 0.45, 0, Math.PI * 2);
                    ctx.fillStyle = `hsla(${hue}, 100%, 80%, 0.9)`;
                    ctx.fill();
                }

                // ---- 2. connecting lines (cosmic web) ----
                ctx.shadowBlur = 12;
                ctx.shadowColor = '#6cf';
                ctx.lineWidth = 1.2;

                // use only a subset for performance & aesthetics (draw lines only if close enough)
                for (let i = 0; i < particles.length; i++) {
                    const a = particles[i];
                    for (let j = i + 1; j < particles.length; j++) {
                        const b = particles[j];
                        const dx = a.x - b.x;
                        const dy = a.y - b.y;
                        const distSq = dx * dx + dy * dy;

                        if (distSq < CONFIG.maxLineDistance * CONFIG.maxLineDistance && distSq > 0.1) {
                            const dist = Math.sqrt(distSq);
                            const alpha = (1 - dist / CONFIG.maxLineDistance) * 0.35;
                            if (alpha < 0.02) continue;

                            // line color based on average hue
                            const hue = (hueBase + (a.hueOffset + b.hueOffset) * 0.5 + time * 20) % 360;
                            ctx.beginPath();
                            ctx.moveTo(a.x, a.y);
                            ctx.lineTo(b.x, b.y);
                            ctx.strokeStyle = `hsla(${hue}, 85%, 65%, ${alpha})`;
                            ctx.stroke();
                        }
                    }
                }

                // ---- 3. central luminous core (drawn last for glow overlay) ----
                ctx.shadowBlur = 45;
                ctx.shadowColor = '#0cf';
                ctx.globalCompositeOperation = 'lighter';

                const coreRadius = 22 + Math.sin(time * 2.5) * 6;
                const coreGradient = ctx.createRadialGradient(
                    width / 2, height / 2, 0,
                    width / 2, height / 2, coreRadius * 2.8
                );
                coreGradient.addColorStop(0, `hsla(${hueBase + 10}, 100%, 75%, 0.9)`);
                coreGradient.addColorStop(0.5, `hsla(${hueBase + 40}, 90%, 55%, 0.4)`);
                coreGradient.addColorStop(1, 'transparent');

                ctx.beginPath();
                ctx.arc(width / 2, height / 2, coreRadius * 2.8, 0, Math.PI * 2);
                ctx.fillStyle = coreGradient;
                ctx.fill();

                // extra tiny bright center
                ctx.shadowBlur = 30;
                ctx.beginPath();
                ctx.arc(width / 2, height / 2, coreRadius * 0.6, 0, Math.PI * 2);
                ctx.fillStyle = `hsla(${hueBase + 60}, 100%, 90%, 0.9)`;
                ctx.fill();

                // reset composite & shadow
                ctx.shadowBlur = 0;
                ctx.shadowColor = 'transparent';
                ctx.globalCompositeOperation = 'source-over';

                requestAnimationFrame(draw);
            }

            // ---- setup event listeners ----
            function init() {
                resizeCanvas();
                window.addEventListener('resize', resizeCanvas);
                window.addEventListener('mousemove', handleMouseMove);
                window.addEventListener('mouseleave', handleMouseLeave);
                // also support touch for mobile
                window.addEventListener('touchmove', (e) => {
                    if (e.touches.length > 0) {
                        mouse.x = e.touches[0].clientX;
                        mouse.y = e.touches[0].clientY;
                        mouse.active = true;
                    }
                }, { passive: true });
                window.addEventListener('touchend', () => {
                    mouse.active = false;
                });

                // start animation
                draw();
            }

            // kick off
            init();
        })();
    </script>
</body>
</html>
