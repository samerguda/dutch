            // --- العناية اليومية (91 - 100) ---

            { id: 92, category: "daily", fl: "Gebruik een hydraterende crème voor een droge huid.", ar: "استخدم مرطباً للبشرة الجافة.", note: "droge huid = بشرة جافة" },
            { id: 93, category: "daily", fl: "Poets uw tanden twee keer per dag.", ar: "نظف أسنانك بالفرشاة مرتين يومياً.", note: "poetsen = تنظيف فرشاة" },
            { id: 94, category: "daily", fl: "Bescherm uw huid tegen de zon met zonnecrème.", ar: "احمِ بشرتك من الشمس بكريم واقي الشمس.", note: "zonnecrème = واقي شمس" },
            { id: 95, category: "daily", fl: "Mondhygiëne voorkomt slechte adem.", ar: "نظافة الفم تمنع الرائحة الكريهة.", note: "mondhygiëne" },

            { id: 97, category: "daily", fl: "Draag gepaste kledij als het koud is.", ar: "ارتدِ ملابس مناسبة عندما يكون الجو برداً.", note: "koud = بارد" },
            { id: 98, category: "daily", fl: "Roken is erg schadelijk voor de gezondheid.", ar: "التدخين ضار جداً بالصحة.", note: "roken = تدخين" },
            { id: 99, category: "daily", fl: "Zorg goed voor uzelf en uw familie.", ar: "اعتنِ بنفسك وبأسرتك جيداً.", note: "zorgen voor = اعتناء بـ" },
            { id: 100, category: "daily", fl: "Gezondheid is het kostbaarste bezit.", ar: "الصحة هي أثمن ما نملك.", note: "حكمة ختامية" }
        ];

        // Global State variables
        let currentCategory = 'all';
        let searchQuery = '';

        // DOM elements
        const grid = document.getElementById('sentencesGrid');
        const searchInput = document.getElementById('searchInput');
        const clearSearchBtn = document.getElementById('clearSearch');
        const visibleCount = document.getElementById('visibleCount');
        const noResults = document.getElementById('noResults');
        const themeToggle = document.getElementById('themeToggle');
        const toast = document.getElementById('toast');
        const toastMsg = document.getElementById('toastMsg');

        // Theme Toggle Logic
        themeToggle.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
        });

        // Speech Synthesis Handler
        function speakText(text) {
            if ('speechSynthesis' in window) {
                // Cancel any ongoing speech
                window.speechSynthesis.cancel();

                const utterance = new SpeechSynthesisUtterance(text);
                // Prefer Flemish (nl-BE) locale, fallback to Dutch (nl-NL)
                utterance.lang = 'nl-BE';
                utterance.rate = 0.88; // Slightly slower for language learning

                // Show toast UI
                showToast(`جاري النطق بالفلمنكية: "${text}"`);

                utterance.onerror = () => {
                    // Fallback to general Dutch if Belgian accent fails on system
                    utterance.lang = 'nl-NL';
                    window.speechSynthesis.speak(utterance);
                };

                window.speechSynthesis.speak(utterance);
            } else {
                alert('متصفحك لا يدعم خاصية نطق الصوت المباشر (Speech Synthesis).');
            }
        }

        // Show Toast Function
        function showToast(message) {
            toastMsg.textContent = message;
            toast.classList.remove('opacity-0', '-translate-y-10');
            toast.classList.add('opacity-100', 'translate-y-0');
            
            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', '-translate-y-10');
            }, 2500);
        }

        // Render Cards Function
        function renderSentences() {
            grid.innerHTML = '';
            
            const filtered = sentences.filter(s => {
                const matchesCat = (currentCategory === 'all' || s.category === currentCategory);
                const matchesSearch = s.fl.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                      s.ar.includes(searchQuery) ||
                                      s.id.toString() === searchQuery.trim();
                return matchesCat && matchesSearch;
            });

            visibleCount.textContent = filtered.length;

            if (filtered.length === 0) {
                noResults.classList.remove('hidden');
            } else {
                noResults.classList.add('hidden');
                
                filtered.forEach(s => {
                    const card = document.createElement('div');
                    card.className = 'bg-white dark:bg-slate-800 rounded-2xl p-5 shadow-sm hover:shadow-xl border border-slate-200/80 dark:border-slate-700/60 transition-all duration-300 flex flex-col justify-between group relative overflow-hidden';
                    
                    card.innerHTML = `
                        <div>
                            <!-- Top Card Bar -->
                            <div class="flex items-center justify-between mb-3">
                                <span class="text-xs font-extrabold px-3 py-1 rounded-full bg-brand-50 dark:bg-brand-900/40 text-brand-700 dark:text-brand-300 border border-brand-200 dark:border-brand-800/50">
                                    #${s.id}
                                </span>
                                <button onclick="speakText('${s.fl.replace(/'/g, "\\'")}')" 
                                    title="استمع للنطق بالفلمنكية"
                                    class="w-10 h-10 rounded-xl bg-slate-100 dark:bg-slate-700/60 text-slate-600 dark:text-slate-300 hover:bg-brand-600 hover:text-white dark:hover:bg-brand-500 dark:hover:text-white transition-all duration-200 flex items-center justify-center shadow-sm active:scale-95">
                                    <i class="fa-solid fa-volume-high text-base"></i>
                                </button>
                            </div>

                            <!-- Flemish Sentence (LTR) -->
                            <div class="mb-3">
                                <p class="flemish-text text-lg sm:text-xl font-bold text-slate-900 dark:text-slate-50 group-hover:text-brand-600 dark:group-hover:text-brand-400 transition-colors leading-relaxed">
                                    ${s.fl}
                                </p>
                            </div>

                            <!-- Arabic Translation (RTL) -->
                            <div class="mb-4">
                                <p class="text-slate-700 dark:text-slate-300 font-medium text-base leading-relaxed">
                                    ${s.ar}
                                </p>
                            </div>
                        </div>

                        <!-- Footer Note / Extra Info -->
                        ${s.note ? `
                            <div class="pt-3 border-t border-slate-100 dark:border-slate-700/50 text-xs text-slate-400 dark:text-slate-500 flex items-center gap-1.5">
                                <i class="fa-regular fa-lightbulb text-amber-500"></i>
                                <span>${s.note}</span>
                            </div>
                        ` : ''}
                    `;
                    grid.appendChild(card);
                });
            }
        }

        // Category Filter Handler
        document.querySelectorAll('.cat-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.cat-btn').forEach(b => {
                    b.classList.remove('bg-brand-600', 'text-white', 'shadow-md', 'shadow-brand-600/30', 'active');
                    b.classList.add('bg-slate-100', 'dark:bg-slate-700', 'text-slate-600', 'dark:text-slate-300');
                });

                const target = e.currentTarget;
                target.classList.remove('bg-slate-100', 'dark:bg-slate-700', 'text-slate-600', 'dark:text-slate-300');
                target.classList.add('bg-brand-600', 'text-white', 'shadow-md', 'shadow-brand-600/30', 'active');

                currentCategory = target.getAttribute('data-category');
                renderSentences();
            });
        });

        // Search Input Handler
        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value;
            if (searchQuery.length > 0) {
                clearSearchBtn.classList.remove('hidden');
            } else {
                clearSearchBtn.classList.add('hidden');
            }
            renderSentences();
        });

        // Clear Search
        clearSearchBtn.addEventListener('click', () => {
            searchInput.value = '';
            searchQuery = '';
            clearSearchBtn.classList.add('hidden');
            renderSentences();
        });

        // Initial Load Render
        window.addEventListener('DOMContentLoaded', () => {
            renderSentences();
        });
    </script>
</body>
