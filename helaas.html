function renderSentences(items) {
    const container = document.getElementById("sentences");
    container.innerHTML = "";

    items.forEach((sentence, index) => {
        const card = document.createElement("article");
        card.className = "card";

        const number = document.createElement("div");
        number.className = "number";
        number.textContent = index + 1;

        const content = document.createElement("div");

        const dutch = document.createElement("div");
        dutch.className = "dutch";
        dutch.textContent = sentence[0];

        const arabic = document.createElement("div");
        arabic.className = "arabic";
        arabic.textContent = sentence[1];

        content.appendChild(dutch);
        content.appendChild(arabic);
        card.appendChild(number);
        card.appendChild(content);
        container.appendChild(card);
    });
}

function searchSentences() {
    const query = document.getElementById("search").value.toLowerCase().trim();

    const filtered = sentences.filter(sentence =>
        sentence[0].toLowerCase().includes(query) ||
        sentence[1].toLowerCase().includes(query)
    );

    renderSentences(filtered);
}
