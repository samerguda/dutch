<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عبارات مرورية بالفلمنكية مع الترجمة العربية</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, 'Noto Kufi Arabic', 'Arial', sans-serif;
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            min-height: 100vh;
            padding: 30px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #1a1a2e;
        }

        .container {
            max-width: 1000px;
            width: 100%;
            background: rgba(255, 255, 255, 0.98);
            border-radius: 30px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.2) inset;
            overflow: hidden;
            backdrop-filter: blur(10px);
        }

        .header {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: "🚦";
            position: absolute;
            font-size: 180px;
            opacity: 0.1;
            left: -30px;
            top: -50px;
            transform: rotate(-15deg);
        }

        .header::after {
            content: "🛣️";
            position: absolute;
            font-size: 150px;
            opacity: 0.1;
            right: -20px;
            bottom: -60px;
            transform: rotate(10deg);
        }

        .header h1 {
            font-size: 2.4rem;
            margin-bottom: 12px;
            font-weight: 800;
            letter-spacing: -0.5px;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            position: relative;
            z-index: 1;
        }

        .header p {
            font-size: 1.15rem;
            opacity: 0.92;
            font-weight: 400;
            position: relative;
            z-index: 1;
            max-width: 650px;
            margin: 0 auto;
            line-height: 1.7;
        }

        .flag-badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.18);
            padding: 6px 18px;
            border-radius: 50px;
            font-size: 0.95rem;
            margin-top: 15px;
            font-weight: 500;
            border: 1px solid rgba(255, 255, 255, 0.25);
            position: relative;
            z-index: 1;
        }

        .legend {
            display: flex;
            justify-content: center;
            gap: 30px;
            padding: 18px 20px;
            background: #f0f4f8;
            border-bottom: 1px solid #dbe4ed;
            flex-wrap: wrap;
        }

        .legend span {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            color: #2d4059;
        }

        .legend .dot {
            width: 14px;
            height: 14px;
            border-radius: 4px;
            display: inline-block;
        }

        .dot.flemish {
            background: #e67e22;
        }

        .dot.arabic {
            background: #2980b9;
        }

        .list-wrapper {
            padding: 10px 0 30px;
        }

        .sentence-item {
            display: flex;
            align-items: stretch;
            border-bottom: 1px solid #eef2f6;
            transition: all 0.2s ease;
        }

        .sentence-item:hover {
            background: #f8fafc;
            transform: scale(1.002);
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
        }

        .sentence-item:last-child {
            border-bottom: none;
        }

        .number-col {
            min-width: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1.1rem;
            color: #ffffff;
            background: linear-gradient(135deg, #2c3e50, #1a252f);
            padding: 18px 12px;
            position: relative;
            flex-shrink: 0;
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.5px;
        }

        .number-col::after {
            content: "";
            position: absolute;
            left: 0;
            top: 15%;
            height: 70%;
            width: 3px;
            background: #f39c12;
            border-radius: 0 3px 3px 0;
        }

        .flemish-col {
            flex: 1;
            padding: 18px 22px;
            display: flex;
            align-items: center;
            font-size: 1.05rem;
            font-weight: 600;
            color: #c0392b;
            background: #fff9f5;
            border-left: 1px solid #f0e6df;
            direction: ltr;
            text-align: left;
            line-height: 1.6;
            font-family: 'Segoe UI', 'Arial', sans-serif;
            letter-spacing: 0.2px;
        }

        .arabic-col {
            flex: 1.1;
            padding: 18px 22px;
            display: flex;
            align-items: center;
            font-size: 1.05rem;
            font-weight: 500;
            color: #1a5276;
            background: #f5f9ff;
            line-height: 1.7;
            direction: rtl;
            text-align: right;
            border-right: 3px solid transparent;
            border-image: linear-gradient(to bottom, #3498db, #2980b9) 1;
        }

        .footer-note {
            text-align: center;
            padding: 22px 20px;
            background: #eef2f7;
            color: #5d6d7e;
            font-size: 0.92rem;
            border-top: 1px solid #d5dfe9;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        @media (max-width: 700px) {
            .header h1 {
                font-size: 1.7rem;
            }

            .header p {
                font-size: 1rem;
            }

            .sentence-item {
                flex-direction: column;
                position: relative;
                padding-top: 12px;
                border-bottom: 2px solid #e0e8f0;
            }

            .number-col {
                min-width: 100%;
                justify-content: flex-start;
                padding: 10px 20px;
                font-size: 0.95rem;
                border-radius: 0;
            }

            .number-col::after {
                display: none;
            }

            .flemish-col,
            .arabic-col {
                padding: 12px 20px;
                border: none;
                font-size: 1rem;
            }

            .flemish-col {
                background: #fff5f0;
            }

            .arabic-col {
                background: #f0f7ff;
                border-right: none;
                border-top: 1px dashed #c8d6e5;
            }

            .legend {
                gap: 15px;
                padding: 14px;
            }

            .legend span {
                font-size: 0.85rem;
            }
        }

        @media (max-width: 400px) {
            .header h1 {
                font-size: 1.35rem;
            }

            .header {
                padding: 28px 16px;
            }

            body {
                padding: 15px 8px;
            }

            .flemish-col,
            .arabic-col {
                font-size: 0.92rem;
                padding: 10px 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚦 100 عبارة مرورية بالفلمنكية</h1>
            <p>مئة جملة عن المرور والشوارع باللهجة الفلمنكية مع الترجمة العربية — مصنّفة بالترقيم من 1 إلى 100</p>
            <div class="flag-badge">🇧🇪 اللهجة الفلمنكية (Vlaams) — بلجيكا</div>
        </div>

        <div class="legend">
            <span><span class="dot flemish"></span> الجملة بالفلمنكية</span>
            <span><span class="dot arabic"></span> الترجمة العربية</span>
        </div>

        <div class="list-wrapper" id="sentenceList">
            <!-- سيتم توليد العناصر هنا بواسطة JavaScript -->
        </div>

        <div class="footer-note">
            ⚡ 100 جملة مرورية مزدوجة اللغة — الفلمنكية / العربية

    </div>

</body>
